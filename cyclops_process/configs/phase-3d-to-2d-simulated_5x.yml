input_channel_names: ["Phase3D"]
time_indices: 'all'
reconstruction_dimension: 2
phase:
  transfer_function:
    wavelength_illumination: 0.450
    yx_pixel_size: 1.3  # Physical pixel size (zarr metadata updated by downsampling)
    z_pixel_size: 2.0   # Native 20x z-step (not downsampled)
    z_padding: 0
    index_of_refraction_media: 1.0
    numerical_aperture_detection: 0.1   # Simulated 5x/0.1NA optics
    numerical_aperture_illumination: 0.15
    invert_phase_contrast: false
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 0.001
    TV_rho_strength: 0.001
    TV_iterations: 1
