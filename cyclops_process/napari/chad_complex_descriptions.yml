# One-line functional descriptions for the CHAD protein complexes.
# Loaded by attention_atlas_shap.py and surfaced as the italic
# subtitle on each complex atlas page (combined with the member-gene
# list from the CHAD positive-controls YAML).
#
# Keys must match the `name` field in the CHAD v5_hierarchy YAML
# (and therefore the `predicted_class` column in Alex's
# pma_top_*_chad_v1.csv) verbatim. Add new entries when new complexes
# are added to v6+.

subu AP1: "AP-1 clathrin adaptor — sorts cargo at the trans-Golgi network and recycling endosomes."
subu AP2: "AP-2 clathrin adaptor — drives clathrin-mediated endocytosis at the plasma membrane."
subu AP3: "AP-3 clathrin adaptor — sorts proteins to lysosomes and lysosome-related organelles."
subu ARP2/3: "Arp2/3 actin nucleator — generates branched actin networks for lamellipodia and endocytosis."
subu ATP synthase: "F1Fo ATP synthase — produces ATP from the mitochondrial proton gradient."
subu Augmin: "Augmin (HAUS) complex — nucleates microtubules from existing microtubules during mitosis."
subu BLOC1: "Biogenesis of Lysosome-related Organelles Complex 1 — sorts cargo to LROs (melanosomes, granules)."
subu BMS1: "BMS1 ribosome biogenesis factor — early 40S small-subunit assembly in the nucleolus."
subu BORC: "BLOC-1-Related Complex — recruits Arl8 to lysosomes for kinesin-driven movement."
subu CCT1 (TRiC) chaperonin: "TRiC/CCT chaperonin (TCP-1 Ring Complex, eight-subunit ATPase) — folds ~10% of cytosolic proteins including actin, tubulin, and WD40-repeat substrates."
subu CDK7: "CDK7–cyclin H–MAT1 (CAK) — phosphorylates the RNA Pol II CTD at transcription start."
subu CFIm: "Cleavage Factor Im — recognizes UGUA elements in pre-mRNA for 3′-end processing."
subu CNOT: "CCR4-NOT — major cytoplasmic mRNA deadenylase complex driving mRNA turnover."
subu COG: "Conserved Oligomeric Golgi (COG) — tethers vesicles for intra-Golgi trafficking."
subu COP9 signalosome: "CSN (COP9 signalosome) — deneddylates cullin-RING E3 ubiquitin ligases."
subu COPI: "COPI vesicle coat — retrograde Golgi-to-ER and intra-Golgi transport."
subu CPC: "Chromosomal Passenger Complex — Aurora B kinase activity at kinetochores during mitosis."
subu CPSF: "Cleavage and Polyadenylation Specificity Factor — pre-mRNA 3′-end cleavage and poly(A) signaling."
subu CTU1: "tRNA thiouridylation (CTU1/CTU2) — installs s2U at the wobble position of cytosolic tRNAs."
subu DNA Polymerase A: "DNA polymerase α / primase — synthesizes RNA primers and initial DNA at replication forks."
subu DNA Polymerase E: "DNA polymerase ε — synthesizes the leading strand of nuclear DNA replication."
subu DNA polymerase zeta: "Pol ζ (REV3L/REV7) — translesion synthesis past damaged DNA bases."
subu EMC: "ER Membrane protein Complex — co-translational insertion of tail-anchored membrane proteins."
subu ESCRT-III: "ESCRT-III — drives membrane scission for MVB sorting, cytokinesis, and viral budding."
subu FARS: "Phenylalanyl-tRNA synthetase — charges tRNA^Phe for cytoplasmic translation."
subu Fanconi: "Fanconi Anemia core complex — coordinates DNA interstrand crosslink repair."
subu GGTase: "Geranylgeranyltransferase I/II — prenylates Rho/Rab GTPases for membrane targeting."
subu GINS: "GINS — accessory subunit of the CMG replicative DNA helicase."
subu GRB2 SOS KRAS: "GRB2–SOS–KRAS signaling node — RAS GTPase activation downstream of RTKs."
subu HRD1-SEL1L: "HRD1–SEL1L — ER-associated degradation (ERAD) E3 ligase complex retrotranslocating misfolded proteins."
subu INO80: "INO80 chromatin remodeler — H2A.Z exchange, DNA repair, and replication restart."
subu Integrator Complex: "Integrator — RNA Pol II transcript termination at snRNAs and PROMPTs."
subu Inter. Fillaments: "Intermediate filaments — cytoskeletal scaffold (vimentin, keratins, lamins, NF)."
subu LSm ring: "Lsm1–7 / Lsm2–8 rings — pre-mRNA splicing snRNP scaffolds and mRNA decapping/decay."
subu MCMs: "MCM2–7 — replicative DNA helicase that unwinds dsDNA at the replication fork (CMG core)."
subu MICOS: "MICOS — mitochondrial inner-membrane cristae-junction architecture."
subu MSC: "Multi-Synthetase Complex — scaffolded aminoacyl-tRNA synthetases for cytoplasmic translation."
subu NCOA4 Ferritin: "NCOA4-mediated ferritinophagy — selective autophagy of ferritin to release iron."
subu NuRD: "NuRD (Nucleosome Remodeling and Deacetylase) — chromatin compaction and gene silencing."
subu OST: "Oligosaccharyltransferase — N-glycosylates nascent proteins in the ER lumen."
subu PAM: "Presequence translocase-Associated Motor — drives mitochondrial matrix protein import."
subu PHB: "Prohibitin (PHB1/PHB2) ring — inner mitochondrial membrane scaffold and m-AAA cofactor."
subu Proteasome 19s: "19S regulatory particle — recognizes ubiquitinated substrates and feeds them to the 20S core."
subu RNA POL2 specific: "RNA polymerase II — transcribes mRNA and most snRNAs."
subu RNA POL3 specific: "RNA polymerase III — transcribes tRNAs, 5S rRNA, and U6 snRNA."
subu RNA Pol1 specific: "RNA polymerase I — transcribes 47S rRNA precursor in the nucleolus."
subu RNA exosome: "RNA exosome — 3′→5′ exoribonuclease complex for RNA quality control and turnover."
subu RPF2: "RPF2/RRS1 — recruits the 5S rRNP onto pre-60S ribosome biogenesis intermediates."
subu Ragulator: "Ragulator (LAMTOR) — anchors Rag GTPases at the lysosome for amino-acid–sensing mTORC1 activation."
subu SEC61: "Sec61 translocon — co-translational protein translocation across the ER membrane."
subu SF3B (U2 snRNP): "SF3B / U2 snRNP — branchpoint recognition during pre-mRNA splicing."
subu SRP: "Signal Recognition Particle — targets nascent secretory and membrane proteins to the ER."
subu SRP receptor: "SRP receptor (SRα/SRβ) — docks SRP–ribosome at the ER membrane for translocation."
subu SSU processome: "90S / SSU processome — early co-transcriptional 40S ribosome assembly intermediate."
subu Sm ring: "Sm core ring — heptameric protein scaffold of major-class spliceosomal snRNPs."
subu TFIIA: "TFIIA — stabilizes TBP–DNA at RNA Pol II transcription start sites."
subu TFIIIC: "TFIIIC — promoter-recognition factor for RNA Pol III type-2 internal promoters."
subu THO: "THO/TREX — couples mRNA transcription to nuclear export."
subu TIM23: "TIM23 translocase — imports presequence-containing proteins into the mitochondrial matrix."
subu TIPIN complex: "TIPIN/TIM/CLASPIN — replication fork protection and ATR-mediated checkpoint signaling."
subu TRAPP III: "TRAPPIII — GEF for Rab1 during autophagy and ER-to-Golgi transport."
subu TSC: "Tuberous Sclerosis Complex (TSC1/TSC2/TBC1D7) — Rheb-GAP that inhibits mTORC1."
subu TTT: "TTT (TEL2–TTI1–TTI2) — chaperones the PIKK kinases mTOR, ATR, ATM, and DNA-PK."
subu U1 snRNP: "U1 snRNP — recognizes the 5′ splice site at the start of pre-mRNA splicing."
subu U5 snRNP: "U5 snRNP — anchors exons in the catalytically active spliceosome."
subu UREL: "UREL complex — function unclear (description pending verification against the v5 cluster source)."
subu V-ATPase: "V-ATPase — proton pump that acidifies endosomes, lysosomes, and secretory vesicles."
subu coenzyme Q: "Coenzyme Q biosynthesis (COQ1–COQ11) — synthesizes ubiquinone for the electron transport chain."
subu cohesin: "Cohesin (SMC1/SMC3/RAD21/STAG) — holds sister chromatids together until anaphase."
subu complex IV: "Cytochrome c oxidase (Complex IV) — terminal electron transport chain enzyme."
subu complex IV assembly: "COX assembly factors — SURF1/SCO/COX10/etc., chaperone Complex IV biogenesis."
subu core mediator complex: "Mediator core — bridges enhancer-bound TFs to RNA Pol II at promoters."
subu dynactin: "Dynactin — activator and processivity factor for cytoplasmic dynein."
subu dynein-1: "Cytoplasmic dynein-1 — minus-end-directed microtubule motor for retrograde transport."
subu eIF2: "eIF2 — delivers initiator Met-tRNAi to the 40S ribosome during translation initiation."
subu eIF2 GEF: "eIF2B — guanine-nucleotide-exchange factor that recycles eIF2·GDP to eIF2·GTP."
subu eIF3: "eIF3 — large multi-subunit translation initiation factor scaffolding 43S assembly."
subu eIF4: "eIF4F (eIF4E/G/A) — m7G cap-binding complex that recruits ribosomes to mRNA."
subu elongator: "Elongator — tRNA modification (mcm5s2U at U34) and RNA Pol II elongation cofactor."
subu exocyst: "Exocyst — tethers post-Golgi secretory vesicles at the plasma membrane."
subu isocitrate dehydrogenase 3: "IDH3 — TCA cycle enzyme, NAD+-dependent isocitrate → α-ketoglutarate."
subu mTOR (mTORC1 and mTORC2): "mTOR kinase complexes — central growth and proliferation signaling."
subu mediator kinase module: "CDK8/CDK19–Cyclin C — Mediator kinase module, transcription regulation."
subu mito ribosome 39s: "Mitoribosome 39S large subunit — translates mt-mRNAs in the matrix."
subu purinisome: "Purinosome — multi-enzyme assembly for de novo purine biosynthesis."
subu retromer: "Retromer (VPS26/VPS29/VPS35) — endosome-to-Golgi cargo recycling."
subu ribosome 40s: "Cytosolic 40S ribosomal subunit — mRNA decoding center for translation."
subu ribosome 60s: "Cytosolic 60S ribosomal subunit — peptidyl-transferase center for translation."
subu shelterin: "Shelterin (TRF1/TRF2/TIN2/POT1/TPP1/RAP1) — protects telomeres from DDR."
subu signal peptidase: "Signal peptidase complex — cleaves ER-targeted signal peptides during translocation."

# v5_hierarchy adds these "GOI" entries beyond the subu cluster set;
# include descriptions if/when they appear in the rendered atlas.
GOI Proteasome 20s: "20S core particle — proteolytic core (β subunits) of the 26S proteasome."
GOI HSPA5: "HSPA5/BiP — ER-resident Hsp70 chaperone driving protein folding and the UPR."
GOI Proteasome regulatory: "Proteasome accessory factors — activators and inhibitors of 26S proteasomal degradation."
GOI mediator core: "Mediator-interacting transcription regulators (general transcription cofactors)."
