# Organelle segmentation parameters, organized by marker.
# Extracted from ops_channel_maps.yaml so params are grouped by marker rather
# than scattered across experiments. Regenerated by tools/extract_seg_params.py.
#
# ============================================================================
# ⚠ SYNC REQUIRED — edits to THIS file (the repo copy) are NOT picked up at
# runtime until they are copied to the shared HPC configs directory:
#   /path/to/ops_data/configs/org_seg_params.yaml
#
# OpsDataset.marker_seg_params resolves to that HPC path (see
# cyclops_utils/data/experiment.py: self.configs = OPS_CONFIGS_DIR or that path).
# Changing this file alone has no effect on segmentation jobs.
#
# After editing, run:
#   python cyclops_process/cyclops_process/configs/sync_configs_to_hpc.py --apply
# (the sync script auto-creates a timestamped backup under
#  /path/to/ops_data/configs/backups/ before
#  overwriting). Or set OPS_CONFIGS_DIR to point at the repo copy in your
#  shell to bypass the HPC path entirely.
# ============================================================================

