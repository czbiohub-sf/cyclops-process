    executor: 'slurm'
    slurm_params:
      timeout_min: 10
      mem: "8G"
      slurm_partition: "cpu"
      cpus: 4
    python_kwargs:
      process: pheno
      dim: 3d
  create_max_projection_lc20x:
    executor: 'slurm'
    slurm_params:
      timeout_min: 30
      mem: "32G"
      slurm_partition: "cpu"
      cpus: 8
    python_kwargs:
      process: lc_20x
  estimate_stitch_parameters_pheno:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "100G"
      slurm_partition: "gpu"
      cpus: 32
    python_kwargs:
      process: pheno
  prepare_unified_pheno_tiles:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "128G"
      slurm_partition: "gpu"
      cpus: 64
  estimate_and_stitch_pheno:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "500G"
      slurm_partition: "gpu"
      cpus: 64
    python_kwargs:
      process: pheno-2d
      zarr_version: *ngff_version
  viscy_normalize:
    executor: 'slurm'
    slurm_params:
      timeout_min: 15
      mem: "200G"
      slurm_partition: "gpu"
      cpus: 8
  build_pyramids_setup:
    executor: 'slurm'
    slurm_params:
      timeout_min: 10
      mem: "8G"
      slurm_partition: "cpu"
      cpus: 4
    python_kwargs:
      use_v3_stores: true
  build_pyramids_position_job:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "360G"
      slurm_partition: "cpu"
      cpus: 32
  auto_register:
    executor: 'slurm'
    slurm_params:
      timeout_min: 180
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 2
  submit_tracking_jobs:
    executor: 'slurm'
    slurm_params:
      timeout_min: 180
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 2
  cell_segmentation:
    executor: 'slurm'
    slurm_params:
      timeout_min: 180
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 2
  link_calls_tracks:
    executor: 'slurm'
    slurm_params:
      timeout_min: 30
      mem: "250G"
      slurm_partition: "cpu"
      cpus: 12
    python_kwargs:
      method: mine
  recompute_metrics:
    executor: 'slurm'
    slurm_params:
      timeout_min: 30
      mem: "32G"
      slurm_partition: "cpu"
      cpus: 4
    python_kwargs:
      method: mine
  # Live-cell raw conversion (dragonfly tiffs -> zarr). Submits per-dataset jobs
  # and waits, so the parent needs a generous timeout to cover the children.
  convert_raw:
    executor: 'slurm'
    slurm_params:
      timeout_min: 240
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 2
  # ISS v2 -> v3 store conversion; submits per-position jobs and waits.
  convert_iss_to_v3:
    executor: 'slurm'
    slurm_params:
      timeout_min: 180
      mem: "20G"
      slurm_partition: "cpu"
      cpus: 2
  correct_flatfield_fluor:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "128G"
      slurm_partition: "cpu"
      cpus: 16
    python_kwargs:
      process: fluor
  # Fluor->Phase2D channel registration — NF fan-out. setup lists eligible fluor
  # channels; each job registers ONE channel (SimpleITK MI, CPU).
  channel_registration_setup:
    executor: 'slurm'
    slurm_params:
      timeout_min: 15
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 2
  channel_registration_job:
    executor: 'slurm'
    slurm_params:
      timeout_min: 30
      mem: "32G"
      slurm_partition: "cpu"
      cpus: 4
  # Native-20x nuclei segmentation — NF fan-out. setup enumerates positions
  # (cheap store scan); each job segments ONE position on a GPU.
  nuclei_segmentation_setup:
    executor: 'slurm'
    slurm_params:
      timeout_min: 15
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 4
  # mem/cpus match nuclei_segmentation_slurm.py:117 default_slurm (per-position,
  # chunk_size=1) to avoid under-provisioning. GPUs=1 (set in iss.config): the
  # source comment notes 2 was only to match cell_seg and "can drop to 1"; the
  # pass uses ~2 GB VRAM, and per-position fan-out favors single-GPU jobs.
  nuclei_segmentation_job:
    executor: 'slurm'
    slurm_params:
      timeout_min: 60
      mem: "256G"
      slurm_partition: "gpu"
      cpus: 32
  # Audit + fix v3 stores; submits its own fix jobs and waits.
  fix_v3_stores:
    executor: 'slurm'
    slurm_params:
      timeout_min: 120
      mem: "16G"
      slurm_partition: "cpu"
      cpus: 4
    python_kwargs:
      auto_fix: true

